# Bind to the ESP from which firmware loaded this GRUB, not a cloned UUID,
# filesystem label, or device enumeration order.
if regexp --set=1:mipad2_esp '^[(]([^()]+)[)]/' "$cmdpath"; then
  if [ -f "($mipad2_esp)/grub/grub.cfg" ]; then
    set root="$mipad2_esp"
    set prefix="($mipad2_esp)/grub"
    configfile "$prefix/grub.cfg"
  fi
fi
echo "Mi Pad 2: GRUB config not found on this EFI system partition ($cmdpath)"
