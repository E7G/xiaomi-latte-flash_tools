name: Test Mi Pad 2 CPU mitigations kernel package

on:
  push:
    branches:
      - test/mipad2-cpu-mitigations-20261003
    paths:
      - '.github/workflows/test-cpu-mitigations-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: E7G/linux_latte
  KERNEL_REF: fix/mipad2-cpu-mitigations-20261003
  KERNEL_JOBS: '4'
  ARCHLINUX_ARCHIVE_DATE: '2026/09/29'

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve kernel source
        id: source
        shell: bash
        run: |
          commit="$(git ls-remote "https://github.com/${KERNEL_REPO}.git" "refs/heads/${KERNEL_REF}" | awk '{print $1}')"
          test -n "$commit"
          commit_date="$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${KERNEL_REPO}/commits/${commit}" \
            | jq -r '.commit.committer.date // empty')"
          test -n "$commit_date"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(date -u -d "$commit_date" +%s)" >> "$GITHUB_OUTPUT"

      - name: Build kernel package
        env:
          KERNEL_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source_date_epoch }}
        run: |
          docker run --rm \
            -e KERNEL_REPO -e KERNEL_REF -e KERNEL_COMMIT -e KERNEL_JOBS \
            -e SOURCE_DATE_EPOCH -e ARCHLINUX_ARCHIVE_DATE \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel \
            bash ./scripts/build_kernel_package.sh

      - name: Verify package
        run: |
          cd kernel-output
          sha256sum -c *.pkg.tar.zst.sha256
          package="$(find . -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          config_path="$(tar -tf "$package" | grep -E 'usr/lib/modules/[^/]+/config$' | head -n1)"
          test -n "$config_path"
          tar -xOf "$package" "$config_path" | grep -qx 'CONFIG_CPU_MITIGATIONS=y'

      - uses: actions/upload-artifact@v4
        with:
          name: mipad2-cpu-mitigations-kernel
          path: |
            kernel-output/*.pkg.tar.zst
            kernel-output/*.pkg.tar.zst.sha256
          compression-level: 0
          retention-days: 1
