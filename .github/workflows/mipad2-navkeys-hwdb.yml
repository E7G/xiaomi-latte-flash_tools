name: Mi Pad 2 navigation keys hwdb
on:
  pull_request:
    branches: [codex/mipad2-7.2-integrated]
    paths:
      - build_rootfs.sh
      - device_files/61-mipad2-navkeys.hwdb
      - tests/test_image_navkeys_hwdb.py
      - .github/workflows/mipad2-navkeys-hwdb.yml
  push:
    branches: [codex/mipad2-7.2-integrated]
    paths:
      - build_rootfs.sh
      - device_files/61-mipad2-navkeys.hwdb
      - tests/test_image_navkeys_hwdb.py
      - .github/workflows/mipad2-navkeys-hwdb.yml
permissions:
  contents: read
jobs:
  image-navkeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test image staging with real systemd-hwdb
        run: |
          bash -n build_rootfs.sh
          python3 -B tests/test_image_navkeys_hwdb.py
          python3 -OB tests/test_image_navkeys_hwdb.py
