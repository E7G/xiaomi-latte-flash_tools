name: Check integrated kernel packaging and handoff
on:
  workflow_dispatch:
  pull_request:
    branches: [codex/mipad2-7.2-integrated]
  push:
    branches: [codex/mipad2-7.2-integrated]
    paths:
      - scripts/package_integrated_kernel.py
      - scripts/preflight_integrated_kernel_package.py
      - tests/test_integrated_kernel_packaging*.py
      - tests/test_modern_integrated_packaging.py
      - scripts/resolve_kernel_artifact.py
      - device_files/mipad2-kernel-install
      - device_files/kernel.hook
      - device_files/kernel-preflight.hook
      - build_rootfs.sh
      - scripts/build_dnx_package.sh
      - scripts/build_kernel_package.sh
      - scripts/stage_kernel_support.py
      - device_files/mipad2-kernel-preflight
      - tests/test_kernel_artifact_handoff.py
      - tests/test_kernel_preflight.py
      - tests/test_kernel_support_staging.py
      - tests/test_image_signing.py
      - tests/test_image_user_profile.py
      - tests/test_camera_focus_guard.py
      - device_files/mipad2-camera-init-focus.service
      - device_files/mipad2-install-to-emmc
      - tests/test_usb_install_secure_boot.py
      - tests/test_usb_install_btrfs_receive.py
      - tests/test_usb_install_btrfs_nested.py
      - tests/test_modern_kernel_handoff.py
      - .github/workflows/build-dnx.yml
      - .github/workflows/integrated-package-check.yml
permissions:
  contents: read
jobs:
  format-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd python3-yaml openssl
      - name: Test legacy and modern readers, identity and real nobody boundary
        run: |
          sudo env PYTHONPATH="$PWD/scripts:$PWD/tests" python3 -m unittest \
            test_integrated_kernel_packaging \
            test_integrated_kernel_packaging_umask \
            test_modern_integrated_packaging.ModernTests
      - name: Test artifact pins, install hooks and rootfs handoff without device access
        run: |
          for script in build_rootfs.sh device_files/mipad2-kernel-install device_files/mipad2-kernel-preflight; do bash -n "$script"; done
          sudo env PYTHONPATH="$PWD/scripts:$PWD/tests" python3 -m unittest \
            test_kernel_artifact_handoff test_modern_kernel_handoff test_kernel_support_staging
          python3 tests/test_kernel_preflight.py
          python3 tests/test_image_signing.py
          python3 tests/test_image_user_profile.py
          python3 tests/test_camera_focus_guard.py
          python3 tests/test_usb_install_secure_boot.py
          python3 tests/test_usb_install_btrfs_receive.py
          python3 tests/test_usb_install_btrfs_nested.py
      # These unsigned fixtures validate format/error handling only. Real module
      # CMS, makepkg, pacman query and byte-preserving package qualification are
      # separate gates against an externally pinned completed kernel artifact.
