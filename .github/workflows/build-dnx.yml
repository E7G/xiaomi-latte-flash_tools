name: Build CachyOS DNX package

on:
  workflow_dispatch:
  push:
    branches: [arch_linux]
    paths:
      - '.github/workflows/build-dnx.yml'
      - 'kernel/**'
      - 'scripts/**'
      - '*.bat'
      - '*.ps1'
      - 'build_rootfs.sh'
      - 'device_files/**'
      - 'gpt.ini'
      - 'gpt_ini2bin.py'

permissions:
  contents: read

concurrency:
  group: dnx-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: E7G/linux_latte
  KERNEL_REF: cachyos-mipad2
  KERNEL_JOBS: '4'
  ROOTFS_SIZE: 8G

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve optimized kernel branch
        id: kernel-source
        shell: bash
        run: |
          commit="$(git ls-remote "https://github.com/${KERNEL_REPO}.git" "refs/heads/${KERNEL_REF}" | awk '{print $1}')"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Building ${KERNEL_REPO}@${KERNEL_REF} (${commit})"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - name: Restore kernel package cache
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: kernel-output
          key: latte-kernel-${{ runner.os }}-${{ steps.kernel-source.outputs.commit }}-${{ hashFiles('scripts/build_kernel_package.sh') }}

      - name: Build optimized linux_latte package
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          KERNEL_COMMIT: ${{ steps.kernel-source.outputs.commit }}
        run: |
          docker run --rm \
            -e KERNEL_REPO -e KERNEL_REF -e KERNEL_COMMIT -e KERNEL_JOBS \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel \
            bash ./scripts/build_kernel_package.sh

      - name: Save kernel package cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel-output
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: Verify kernel package
        run: |
          cd kernel-output
          sha256sum -c *.pkg.tar.zst.sha256
          contents="${RUNNER_TEMP}/latte-kernel-package-contents.txt"
          tar -tf *.pkg.tar.zst > "$contents"
          grep -q 'usr/lib/firmware/intel/ipu/shisp_2401a0_v21.bin' "$contents"
          grep -q 'usr/local/libexec/mipad2-usb-serial' "$contents"
          grep -q 'usr/local/libexec/mipad2-hardware-smoke' "$contents"
          grep -q 'etc/systemd/system/mipad2-hardware-audit.service' "$contents"
          grep -Eq 'usr/lib/modules/[^/]+/config$' "$contents"
          grep -Eq 'usr/lib/modules/[^/]+/kernel/drivers/net/wireless/broadcom/brcm80211/brcmfmac/brcmfmac\.ko' "$contents"
          grep -Eq 'usr/lib/modules/[^/]+/kernel/drivers/bluetooth/btbcm\.ko' "$contents"
          grep -Eq 'usr/lib/modules/[^/]+/kernel/drivers/media/i2c/ov5693\.ko' "$contents"
          grep -Eq 'usr/lib/modules/[^/]+/kernel/drivers/media/i2c/t4ka3\.ko' "$contents"
          grep -Eq 'usr/lib/modules/[^/]+/kernel/drivers/media/i2c/dw9719\.ko' "$contents"
          grep -q 'usr/lib/firmware/brcm/brcmfmac4356-pcie.Xiaomi Inc-Mipad2.txt' "$contents"
          grep -q 'usr/lib/firmware/brcm/BCM4356A2.hcd' "$contents"
          grep -q 'usr/share/alsa/ucm2/conf.d/cht-bsw-rt5659/HiFi.conf' "$contents"
          ls -lh *.pkg.tar.zst

      - name: Upload kernel package for DNX job
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-latte-cachyos-kernel
          path: |
            kernel-output/*.pkg.tar.zst
            kernel-output/*.pkg.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  dnx:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - name: Download kernel package
        uses: actions/download-artifact@v4
        with:
          name: xiaomi-latte-cachyos-kernel
          path: kernel-output

      - name: Prepare NBD devices
        run: |
          sudo modprobe nbd max_part=8
          ls -l /dev/nbd0 /dev/nbd1

      - name: Build rootfs and one-click package
        run: |
          docker run --rm --privileged \
            -e ROOTFS_SIZE -e GITHUB_RUN_NUMBER \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel \
            bash -lc 'pacman -Sy --noconfirm arch-install-scripts btrfs-progs dosfstools gptfdisk qemu-img xz zstd && bash ./scripts/build_dnx_package.sh'

      - name: Verify generated packages
        run: |
          bash -n build_rootfs.sh
          bash -n device_files/mipad2-kernel-install
          grep -q 'desktop_type="${desktop_type:-gnome}"' build_rootfs.sh
          grep -q 'qt6-base qt6-wayland qt6-5compat iio-sensor-proxy' build_rootfs.sh
          grep -q 'brave-bin' build_rootfs.sh
          grep -q 'zram-size = ram \* 3 / 4' build_rootfs.sh
          grep -q 'compression-algorithm = lz4' build_rootfs.sh
          grep -q 'mipad2-gnome-osk-patch' build_rootfs.sh
          python -m py_compile device_files/mipad2-gnome-osk-patch
          python -m json.tool device_files/brave-lean-policy.json >/dev/null
          grep -q '^wifi.powersave=2$' device_files/20-mipad2-wifi-powersave.conf
          grep -q '^vm.swappiness = 60$' device_files/99-mipad2-lowlatency.conf
          grep -q 'AcceleratedVideoDecodeLinuxGL,VaapiIgnoreDriverChecks' device_files/brave-flags.conf
          grep -q 'org.gnome.desktop.session idle-delay 0' build_rootfs.sh
          grep -q "sleep-inactive-ac-type 'nothing'" build_rootfs.sh
          grep -q "sleep-inactive-battery-type 'nothing'" build_rootfs.sh
          grep -q 'Exec = /usr/local/sbin/mipad2-kernel-install' device_files/kernel.hook
          cd dist
          sha256sum -c *.sha256
          xz -t *.img.xz
          test "$(openssl x509 -in ../device_files/MOK.crt -noout -fingerprint -sha256 | tr -d ':' | cut -d= -f2)" = '9C8AF8E2C75D0B5D7887A2F70EEA56F8CEA9F4FE8B3AF1070CCC74408B811DF1'
          echo '9c8af8e2c75d0b5d7887a2f70eea56f8cea9f4fe8b3af1070ccc74408b811df1  ../device_files/MOK.cer' | sha256sum -c -
          echo 'af677ea5fb0ff1e70b34d18118a55b7dad70325c8d3920000b58427ae22a7c3d  ../device_files/fastboot.efi' | sha256sum -c -
          ls -lh *
          cd ../work/dnx-package
          sha256sum -c SHA256SUMS
          test -f ONE_KEY_FLASH.bat
          test -f flash-one-click.ps1
          test -f platform-tools/fastboot.exe
          test -f images/gpt.bin
          test -f images/xiaomi-latte-boot.img
          test -f images/xiaomi-latte-rootfs.img
          test ! -e device_files/MOK.key

      - name: Verify boot image layout
        run: |
          set -Eeuo pipefail
          esp="$(mktemp -d)"
          rootfs="$(mktemp -d)"
          cleanup() {
            mountpoint -q "$rootfs/home" && sudo umount "$rootfs/home" || true
          mountpoint -q "$rootfs" && sudo umount "$rootfs" || true
            mountpoint -q "$esp" && sudo umount "$esp" || true
            rmdir "$rootfs" || true
            rmdir "$esp" || true
          }
          trap cleanup EXIT
          sudo mount -o loop,ro work/dnx-package/images/xiaomi-latte-boot.img "$esp"
          test -s "$esp/EFI/BOOT/BOOTX64.EFI"
          test -s "$esp/EFI/BOOT/grubx64.efi"
          test -s "$esp/EFI/BOOT/grub.cfg"
          test -s "$esp/grub/grub.cfg"
          test ! -e "$esp/EFI/MOK.key"
          grep -q 'configfile.*grub.cfg' "$esp/EFI/BOOT/grub.cfg"
          cmp "$esp/EFI/BOOT/grubx64.efi" "$esp/EFI/BOOT/BOOTX64.EFI"
          sudo mount -o loop,ro,subvol=@ work/dnx-package/images/xiaomi-latte-rootfs.img "$rootfs"
          sudo mount -o loop,ro,subvol=@home work/dnx-package/images/xiaomi-latte-rootfs.img "$rootfs/home"
          test -s "$rootfs/var/lib/mipad2/secureboot/MOK.key"
          test "$(stat -c %a "$rootfs/var/lib/mipad2/secureboot/MOK.key")" = 600
          test -x "$rootfs/usr/local/sbin/mipad2-install-to-emmc"
          test -s "$rootfs/etc/systemd/system/mipad2-usb-installer.service"
          test -L "$rootfs/etc/systemd/system/multi-user.target.wants/mipad2-usb-installer.service"
          test -L "$rootfs/etc/systemd/system/multi-user.target.wants/mipad2-hardware-audit.service"
          test -x "$rootfs/usr/local/libexec/mipad2-navkeys.py"
          test -s "$rootfs/etc/systemd/system/mipad2-navkeys.service"
          test -L "$rootfs/etc/systemd/system/multi-user.target.wants/mipad2-navkeys.service"
          kernel_release="$(find "$rootfs/usr/lib/modules" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n1)"
          test -n "$kernel_release"
          test -s "$rootfs/usr/lib/modules/$kernel_release/modules.dep"
          test -s "$rootfs/usr/lib/modules/$kernel_release/config"
          test -x "$rootfs/usr/local/sbin/mipad2-kernel-install"
          grep -q 'Exec = /usr/local/sbin/mipad2-kernel-install' "$rootfs/etc/pacman.d/hooks/kernel.hook"
          test -x "$rootfs/usr/bin/gnome-shell"
          test -x "$rootfs/usr/bin/brave"
          test ! -x "$rootfs/usr/bin/firefox"
          test -x "$rootfs/usr/lib/rtkit-daemon"
          test -x "$rootfs/usr/local/sbin/mipad2-gnome-osk-patch"
          test -s "$rootfs/etc/pacman.d/hooks/95-mipad2-gnome-osk.hook"
          test -s "$rootfs/etc/brave/policies/managed/lean-browser.json"
          test -s "$rootfs/home/user/.config/brave-flags.conf"
          grep -q '^wifi.powersave=2$' "$rootfs/etc/NetworkManager/conf.d/20-mipad2-wifi-powersave.conf"
          grep -q '^vm.swappiness = 60$' "$rootfs/etc/sysctl.d/99-mipad2-lowlatency.conf"
          grep -q '^vm.page-cluster = 0$' "$rootfs/etc/sysctl.d/99-mipad2-lowlatency.conf"
          grep -q '^zram-size = ram \* 3 / 4$' "$rootfs/etc/systemd/zram-generator.conf"
          grep -q '^compression-algorithm = lz4$' "$rootfs/etc/systemd/zram-generator.conf"
          grep -q '^swap-priority = 100$' "$rootfs/etc/systemd/zram-generator.conf"
          grep -q 'AcceleratedVideoDecodeLinuxGL,VaapiIgnoreDriverChecks' "$rootfs/home/user/.config/brave-flags.conf"
          grep -q '^x-scheme-handler/https=brave-browser.desktop$' "$rootfs/home/user/.config/mimeapps.list"
          test -x "$rootfs/usr/bin/qv4l2"
          test ! -x "$rootfs/usr/bin/snapshot"
          test -e "$rootfs/usr/lib/libQt6Core.so.6"
          test -s "$rootfs/home/user/.local/share/applications/mipad2-camera.desktop"
          grep -q '^Exec=qv4l2 -d /dev/video0$' "$rootfs/home/user/.local/share/applications/mipad2-camera.desktop"
          grep -q '^Hidden=true$' "$rootfs/home/user/.local/share/applications/qv4l2.desktop"
          test -L "$rootfs/etc/systemd/system/display-manager.service"
          test "$(readlink "$rootfs/etc/systemd/system/display-manager.service")" = '/usr/lib/systemd/system/gdm.service'
          grep -q '^AutomaticLoginEnable=True$' "$rootfs/etc/gdm/custom.conf"
          test ! -x "$rootfs/usr/bin/plasmalogin"
          test -s "$rootfs/usr/lib/firmware/brcm/brcmfmac4356-pcie.Xiaomi Inc-Mipad2.txt"
          test -s "$rootfs/usr/lib/firmware/brcm/BCM4356A2.hcd"
          test -s "$rootfs/usr/share/alsa/ucm2/conf.d/cht-bsw-rt5659/HiFi.conf"

      - name: Validate Windows flasher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './flash-one-click.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Upload one-click USB installer image
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-latte-cachyos-usb-imgxz
          path: |
            dist/*.img.xz
            dist/*.img.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload ready-to-run one-click flash package
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-latte-cachyos-one-click
          path: work/dnx-package/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
