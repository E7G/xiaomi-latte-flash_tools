name: Build CachyOS DNX package

on:
  workflow_dispatch:
  push:
    branches: [arch_linux]
    paths:
      - '.github/workflows/build-dnx.yml'
      - 'kernel/**'
      - 'scripts/**'
      - 'build_rootfs.sh'
      - 'device_files/**'
      - 'gpt.ini'
      - 'gpt_ini2bin.py'

permissions:
  contents: read

concurrency:
  group: dnx-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: E7G/linux_latte
  KERNEL_REF: bc851227257b9d96f9d098459454d9bcc73e70e8
  KERNEL_JOBS: '4'
  ROOTFS_SIZE: 8G

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - name: Restore kernel package cache
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: kernel-output
          key: latte-kernel-${{ runner.os }}-${{ env.KERNEL_REF }}-${{ hashFiles('kernel/**', 'scripts/build_kernel_package.sh') }}

      - name: Build optimized linux_latte package
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -e KERNEL_REPO -e KERNEL_REF -e KERNEL_JOBS \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel \
            bash ./scripts/build_kernel_package.sh

      - name: Save kernel package cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel-output
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: Verify kernel package
        run: |
          cd kernel-output
          sha256sum -c *.pkg.tar.zst.sha256
          tar -tf *.pkg.tar.zst > package-contents.txt
          grep -q 'usr/lib/firmware/intel/ipu/shisp_2401a0_v21.bin' package-contents.txt
          grep -q 'usr/local/libexec/mipad2-usb-serial' package-contents.txt
          grep -q 'usr/local/libexec/mipad2-hardware-smoke' package-contents.txt
          ls -lh *.pkg.tar.zst

      - name: Upload kernel package for DNX job
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-latte-cachyos-kernel
          path: |
            kernel-output/*.pkg.tar.zst
            kernel-output/*.pkg.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  dnx:
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - name: Download kernel package
        uses: actions/download-artifact@v4
        with:
          name: xiaomi-latte-cachyos-kernel
          path: kernel-output

      - name: Prepare NBD devices
        run: |
          sudo modprobe nbd max_part=8
          ls -l /dev/nbd0 /dev/nbd1

      - name: Build rootfs and DNX archive
        run: |
          docker run --rm --privileged \
            -e ROOTFS_SIZE -e GITHUB_RUN_NUMBER \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel \
            bash -lc 'pacman -Sy --noconfirm arch-install-scripts btrfs-progs dosfstools gptfdisk qemu-img xz zstd && bash ./scripts/build_dnx_package.sh'

      - name: Verify archive
        run: |
          cd dist
          sha256sum -c *.sha256
          xz -t *.img.xz
          openssl x509 -in ../device_files/MOK.crt -noout -fingerprint -sha256
          echo '4c89145e958cf592a6f16552eadf112ef2c1c525e2435c2761e6a99fa88188b3  ../device_files/shimx64.efi' | sha256sum -c -
          echo '5f9fc41db3dfe3b581fc20cae696af82c5ca21e96071ec9c4c28ee4a15f989d8  ../device_files/mmx64.efi' | sha256sum -c -
          ls -lh *

      - name: Upload USB image only
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-latte-cachyos-usb-imgxz
          path: |
            dist/*.img.xz
            dist/*.img.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload DNX package only
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-latte-cachyos-dnx
          path: |
            dist/*.tar.zst
            dist/*.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
