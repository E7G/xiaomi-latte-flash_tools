name: Build CachyOS DNX package

on:
  workflow_dispatch:
  push:
    branches: [arch_linux]
    paths:
      - '.github/workflows/build-dnx.yml'
      - 'kernel/**'
      - 'scripts/**'
      - 'build_rootfs.sh'
      - 'device_files/**'
      - 'gpt.ini'
      - 'gpt_ini2bin.py'

permissions:
  contents: read

concurrency:
  group: dnx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      KERNEL_REF: e89ea264f5ca311c9dca9088d964b80ec40472b4
      KERNEL_JOBS: '4'
      ROOTFS_SIZE: 8G
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - name: Build optimized linux_latte package
        run: |
          docker run --rm \
            -e KERNEL_REF -e KERNEL_JOBS \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel \
            bash ./scripts/build_kernel_package.sh

      - name: Prepare NBD devices
        run: |
          sudo modprobe nbd max_part=8
          ls -l /dev/nbd0 /dev/nbd1

      - name: Build rootfs and DNX archive
        run: |
          docker run --rm --privileged \
            -e ROOTFS_SIZE -e GITHUB_RUN_NUMBER \
            -v "$PWD:/workspace" -w /workspace \
            archlinux:base-devel \
            bash -lc 'pacman -Sy --noconfirm arch-install-scripts btrfs-progs dosfstools qemu-img zstd && bash ./scripts/build_dnx_package.sh'

      - name: Verify archive
        run: |
          sha256sum -c dist/*.sha256
          ls -lh dist/* kernel-output/*.pkg.tar.zst

      - name: Upload DNX package
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-latte-cachyos-dnx
          path: |
            dist/*.tar.zst
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
